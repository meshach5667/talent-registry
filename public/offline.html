<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline | Talent Registry</title>
  <meta name="theme-color" content="#059669">
  <link rel="icon" href="/icons/icon-192.png">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #090d16;
      color: #f3f4f6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .card {
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 20px;
      padding: 40px 32px;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }
    .icon-container {
      width: 64px;
      height: 64px;
      border-radius: 16px;
      background: #064e3b;
      border: 1px solid #059669;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
    }
    .icon-container svg {
      width: 32px;
      height: 32px;
      stroke: #34d399;
    }
    h1 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 10px;
      color: #ffffff;
    }
    p {
      font-size: 13px;
      color: #9ca3af;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: #059669;
      color: #ffffff;
      font-size: 13px;
      font-weight: 600;
      padding: 12px 24px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      width: 100%;
      transition: background 0.2s, transform 0.1s;
    }
    .btn:hover {
      background: #10b981;
    }
    .btn:active {
      transform: scale(0.98);
    }
    .footer {
      margin-top: 24px;
      font-size: 11px;
      color: #6b7280;
    }
    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #f87171;
      font-size: 11px;
      font-weight: 500;
      border-radius: 9999px;
      margin-bottom: 16px;
    }
    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #ef4444;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="status-pill">
      <span class="status-dot"></span>
      <span>No Internet Connection</span>
    </div>

    <div class="icon-container">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
        <path d="m9 12 2 2 4-4"></path>
      </svg>
    </div>

    <h1>You Are Currently Offline</h1>
    <p>
      Talent Registry could not reach the network. Your cached data and offline records will remain available when you reconnect.
    </p>

    <button class="btn" onclick="window.location.reload()">
      Retry Connection
    </button>

    <div class="footer">
      Talent Registry • Pan-African Verification Network
    </div>
  </div>
</body>
</html>
